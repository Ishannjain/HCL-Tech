services:
  api:
    build: .
    env_file: .env
    environment:
      RUNTIME_DIR: /project/runtime
      HF_HOME: /project/runtime/huggingface
    volumes:
      - ./runtime:/project/runtime
    ports:
      - "127.0.0.1:8000:8000"
    command: ["sh", "-c", "python -m scripts.bootstrap && exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json; assert json.load(urllib.request.urlopen('http://localhost:8000/health'))['ready']"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 5
  ui:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      RETAIL_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "streamlit", "run", "ui/streamlit_app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; assert urllib.request.urlopen('http://localhost:8501/_stcore/health').status == 200"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
